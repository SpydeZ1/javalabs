services:
  postgres:
    image: postgres:16-alpine
    container_name: translation-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: translation
      POSTGRES_USER: translation_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - translation_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translation_owner -d translation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  translation_pgdata:
